# ============================================================================
# Thakran OS — Calamares Installer Settings
# ============================================================================
# Located usually in /etc/calamares/settings.conf on the live ISO.
# Defines the module sequence for installing Thakran OS to a hard drive.
# ============================================================================

modules-search: [ local ]

instances:
- id:       thakran
  module:   packagechooser
  config:   packagechooser.conf

- id:       hw_profile
  module:   shellprocess
  config:   hw_profile.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - initcpiocfg
  - initcpio
  - removeuser
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - packages
  - grubcfg
  - bootloader
  - shellprocess@hw_profile
  - umount
- show:
  - finished

branding: thakran
prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: false
quit-at-end: false
