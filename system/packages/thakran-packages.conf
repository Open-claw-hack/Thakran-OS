# ============================================================================
# Thakran OS — Package Configuration
# ============================================================================
# Defines the base packages and Thakran-specific repositories.
# ============================================================================

[repository]
name = Thakran OS Official
url = https://packages.thakranos.dev/stable
gpg_key = https://packages.thakranos.dev/keys/thakran-archive-key.gpg
enabled = true
priority = 100

[repository-dev]
name = Thakran OS Development
url = https://packages.thakranos.dev/dev
gpg_key = https://packages.thakranos.dev/keys/thakran-dev-key.gpg
enabled = false
priority = 50

# ─── Base System Packages ──────────────────────────────────────────────────
[base-packages]
# Core system
systemd
dbus
udev
util-linux
coreutils
bash
sudo

# Networking
networkmanager
iwd
bluez
openssh-client

# Display
wayland
wayland-protocols
wlroots
mesa
libdrm

# Audio
pipewire
pipewire-pulse
wireplumber

# Fonts
fonts-inter
fonts-jetbrains-mono
fonts-noto
fonts-noto-color-emoji

# ─── Thakran Packages ─────────────────────────────────────────────────────
[thakran-packages]
thakran-kernel
thakran-aid
thakran-desktop-shell
thakran-settings
thakran-file-manager
thakran-terminal
thakran-assistant
thakran-app-store
thakran-system-monitor
thakran-theme
thakran-wallpapers
thakran-icons
thakran-grub-theme
thakran-plymouth-theme

# ─── AI Runtime Dependencies ──────────────────────────────────────────────
[ai-packages]
python3
python3-pip
python3-venv
cmake
build-essential
# GPU compute
nvidia-cuda-toolkit-runtime
rocm-hip-runtime
intel-level-zero-gpu
# AI inference
llama-cpp-python
onnxruntime
