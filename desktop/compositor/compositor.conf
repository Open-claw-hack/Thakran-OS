# ============================================================================
# Thakran OS — Wayland Compositor Configuration
# ============================================================================
# Configuration for the wlroots-based Wayland compositor.
# Handles window management, display, and input.
# ============================================================================

[core]
# Backend: auto-detect (DRM for physical, Wayland/X11 for nested)
backend = auto
# Renderer: auto-detect GPU capabilities
renderer = auto

[output]
# Display configuration
mode = preferred          # Use display's preferred mode
scale = auto              # Auto-detect HiDPI
transform = normal        # normal, 90, 180, 270, flipped

[input]
# Keyboard
xkb_layout = us
repeat_delay = 300
repeat_rate = 50

# Touchpad (laptop)
tap_to_click = true
natural_scroll = true
scroll_method = two_finger
accel_profile = adaptive
accel_speed = 0.0
disable_while_typing = true

# Mouse
mouse_accel_profile = flat
mouse_accel_speed = 0.0

[appearance]
# Window decorations
border_width = 2
border_color_focused = #a855f7
border_color_unfocused = #1a1a3e
title_bar = false         # Use client-side decorations

# Gaps
inner_gap = 8
outer_gap = 8

# Corner radius (requires compositor support)
corner_radius = 12

# Shadows
shadow = true
shadow_color = rgba(0, 0, 0, 0.5)
shadow_size = 32
shadow_offset_x = 0
shadow_offset_y = 4

# Blur (glassmorphism for transparent windows)
blur = true
blur_radius = 20
blur_passes = 2

# Animations
animation_duration = 250
animation_curve = ease-out
fade_in = true
scale_up = true

[workspace]
# Number of virtual desktops
count = 4
names = ["Main", "Code", "Media", "System"]

[keybindings]
# Modifier key
mod = Super

# Application shortcuts
mod+Return = thakran-terminal
mod+Space = thakran-launcher
mod+E = thakran-file-manager
mod+A = thakran-assistant
mod+S = thakran-settings

# Window management
mod+Q = close_window
mod+F = toggle_fullscreen
mod+M = toggle_maximize
mod+H = move_left
mod+L = move_right
mod+J = move_down
mod+K = move_up

# Workspace switching  
mod+1 = workspace_1
mod+2 = workspace_2
mod+3 = workspace_3
mod+4 = workspace_4

# Screenshots
Print = screenshot_full
mod+Print = screenshot_region
mod+Shift+Print = screenshot_window

# System
mod+Shift+Q = logout
mod+Shift+R = reload_config
XF86AudioRaiseVolume = volume_up
XF86AudioLowerVolume = volume_down
XF86AudioMute = volume_mute
XF86MonBrightnessUp = brightness_up
XF86MonBrightnessDown = brightness_down

[autostart]
# Services started with the compositor
thakran-panel = /usr/lib/thakran/desktop/panel
thakran-notifications = /usr/lib/thakran/desktop/notifications
thakran-wallpaper = /usr/lib/thakran/desktop/wallpaper-daemon
