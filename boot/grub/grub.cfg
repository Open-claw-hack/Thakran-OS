# ============================================================================
# Thakran OS — GRUB Configuration
# ============================================================================

GRUB_DEFAULT=0
GRUB_TIMEOUT=5
GRUB_TIMEOUT_STYLE=menu

# Thakran OS branding
GRUB_DISTRIBUTOR="Thakran OS"

# Kernel boot parameters
GRUB_CMDLINE_LINUX_DEFAULT="quiet splash loglevel=3 rd.udev.log_priority=3 vt.global_cursor_default=0 systemd.show_status=auto"
GRUB_CMDLINE_LINUX=""

# Enable OS prober for dual-boot detection
GRUB_DISABLE_OS_PROBER=false

# Theme
GRUB_THEME="/boot/grub/themes/thakran/theme.txt"

# Console resolution
GRUB_GFXMODE=1920x1080,auto
GRUB_GFXPAYLOAD_LINUX=keep

# Enable encrypted disk support
GRUB_ENABLE_CRYPTODISK=y

# Terminal output
GRUB_TERMINAL_OUTPUT="gfxterm"
